[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "A JSON-backed command-line expense tracker with filtering, summaries and CSV export."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Priyanshu Kumar", email = "priyanshkk@users.noreply.github.com" }]
keywords = ["cli", "finance", "expenses", "json"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
expense-tracker = "expense_tracker.__main__:main"

[project.urls]
Homepage = "https://github.com/priyanshkk/expense-tracker"
Repository = "https://github.com/priyanshkk/expense-tracker"
Issues = "https://github.com/priyanshkk/expense-tracker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
